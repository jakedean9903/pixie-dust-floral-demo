# Netlify: GitHub-connected continuous deployment. Every push to main runs the build,
# which pre-renders every page from data/site-content.json into dist/.
[build]
  command = "node build/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Order functions: create-checkout (Stripe) and stripe-webhook (saves orders to Airtable).
# Both stay inactive until STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET are set and Preview Mode is off.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
